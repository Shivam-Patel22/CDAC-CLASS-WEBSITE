<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 64" width="480" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@600;700&amp;family=Outfit:wght@700;800&amp;display=swap');
      .hi-left { font-family: 'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif; font-weight: 700; fill: #0B2545; font-size: 20px; }
      .hi-right { font-family: 'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif; font-weight: 700; fill: #0B2545; font-size: 18px; }
      .en-right { font-family: 'Outfit', 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; fill: #0B2545; font-size: 11.5px; letter-spacing: 0.15px; }
      .line-sep { stroke: #0B2545; stroke-width: 2; }
    </style>
  </defs>

  <!-- 1. Vector Computer / Monitor Icon (Fully visible, aligned, uncropped) -->
  <g transform="translate(4, 12)">
    <!-- Monitor Outer Frame -->
    <rect x="0" y="0" width="34" height="24" rx="4" ry="4" fill="none" stroke="#0B2545" stroke-width="2.5"/>
    <!-- Monitor Inner Screen -->
    <rect x="3" y="3" width="28" height="15" rx="1.5" ry="1.5" fill="#0B2545" opacity="0.15"/>
    <!-- Screen Code / Content Graphic Lines -->
    <line x1="7" y1="8" x2="20" y2="8" stroke="#0B2545" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7" y1="12" x2="27" y2="12" stroke="#0B2545" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Monitor Stand -->
    <path d="M 14,24 L 12,32 L 22,32 L 20,24 Z" fill="#0B2545"/>
    <!-- Monitor Base -->
    <rect x="8" y="32" width="18" height="2.5" rx="1" fill="#0B2545"/>
  </g>

  <!-- 2. Authentic C-DAC Emblem (सी-डैक & CDAC) -->
  <g transform="translate(48, 2)">
    <!-- Top Row: Devanagari सी-डैक -->
    <g transform="translate(0, 0)">
      <!-- 'सी' stylized outlined icon -->
      <path d="M 12,25 L 7,25 C 4,25 2,23 2,20 C 2,16 5,14 10,14 C 14,14 16,11 16,7 C 16,3 12,1 8,1 C 3,1 0,4 0,8 L 3,8 C 3,5 5,3 8,3 C 10,3 13,4 13,7 C 13,9 12,12 8,12 C 2,12 0,16 0,20 C 0,25 4,27 12,27 Z" fill="#0B2545"/>
      <rect x="18" y="2" width="3" height="25" fill="#0B2545"/>
      <path d="M 8,1 L 18,1 L 18,3 L 8,3 Z" fill="#0B2545"/>
      <!-- horizontal notches on stem -->
      <rect x="14" y="14" width="3" height="1.5" fill="#FFFFFF"/>
      <rect x="14" y="17" width="3" height="1.5" fill="#FFFFFF"/>
      <rect x="14" y="20" width="3" height="1.5" fill="#FFFFFF"/>
      <rect x="14" y="23" width="3" height="1.5" fill="#FFFFFF"/>
      <rect x="22" y="15" width="2.5" height="2.5" fill="#0B2545"/>
      <rect x="22" y="21" width="2.5" height="2.5" fill="#0B2545"/>

      <!-- '-डैक' text with hyphen (सी-डैक) -->
      <text x="26" y="24" class="hi-left">-डैक</text>
    </g>

    <!-- Bottom Row: Authentic Stylized CDAC letters -->
    <g transform="translate(0, 30)">
      <!-- First C (Racetrack double line outline) -->
      <path d="M 23,2 L 13,2 C 6,2 1,7 1,15 C 1,23 6,28 13,28 L 23,28 L 23,23 L 13,23 C 8,23 5,20 5,15 C 5,10 8,7 13,7 L 23,7 Z" fill="#0B2545"/>
      
      <!-- Letter D with 3 horizontal white stripes -->
      <path d="M 27,2 L 37,2 C 44,2 49,7 49,15 C 49,23 44,28 37,28 L 27,28 Z" fill="#0B2545"/>
      <!-- D stripes -->
      <rect x="29" y="9" width="6" height="2.2" fill="#FFFFFF"/>
      <rect x="29" y="14" width="6" height="2.2" fill="#FFFFFF"/>
      <rect x="29" y="19" width="6" height="2.2" fill="#FFFFFF"/>

      <!-- Letter A with 4 vertical white stripes -->
      <path d="M 52,28 L 52,13 C 52,6 57,2 62,2 C 67,2 72,6 72,13 L 72,28 L 66,28 L 66,13 C 66,9 64,7 62,7 C 60,7 58,9 58,13 L 58,28 Z" fill="#0B2545"/>
      <!-- A inner vertical stripes -->
      <rect x="59.5" y="18" width="1.5" height="7" fill="#FFFFFF"/>
      <rect x="62" y="18" width="1.5" height="7" fill="#FFFFFF"/>
      <rect x="64.5" y="18" width="1.5" height="7" fill="#FFFFFF"/>
      <rect x="67" y="18" width="1.5" height="7" fill="#FFFFFF"/>

      <!-- Second C -->
      <path d="M 96,2 L 85,2 C 78,2 74,7 74,15 C 74,23 78,28 85,28 L 96,28 L 96,21 L 85,21 C 82,21 80,18 80,15 C 80,12 82,9 85,9 L 96,9 Z" fill="#0B2545"/>
    </g>
  </g>

  <!-- 3. Vertical Separator Line -->
  <line x1="154" y1="6" x2="154" y2="58" class="line-sep"/>

  <!-- 4. Right Side Text -->
  <g transform="translate(166, 0)">
    <!-- Top Line Hindi: प्रगत संगणन विकास केंद्र -->
    <text x="0" y="25" class="hi-right">प्रगत संगणन विकास केंद्र</text>
    <!-- Bottom Line English: CENTRE FOR DEVELOPMENT OF ADVANCED COMPUTING -->
    <text x="0" y="48" class="en-right">CENTRE FOR DEVELOPMENT OF ADVANCED COMPUTING</text>
  </g>
</svg>
