<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 64" width="435" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@600;700&amp;family=Outfit:wght@700;800&amp;display=swap');
      .hi-left { font-family: 'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif; font-weight: 700; fill: #0B2545; font-size: 20px; }
      .hi-right { font-family: 'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif; font-weight: 700; fill: #0B2545; font-size: 18.5px; }
      .en-right { font-family: 'Outfit', 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; fill: #0B2545; font-size: 12.2px; letter-spacing: 0.2px; }
      .line-sep { stroke: #0B2545; stroke-width: 2; }
    </style>
  </defs>

  <!-- Left Side: Seedac | CDAC Emblem -->
  <g transform="translate(2, 0)">
    <!-- Hindi सीडैक -->
    <text x="0" y="24" class="hi-left">सीडैक</text>

    <!-- CDAC Icon Emblem -->
    <g transform="translate(0, 30)">
      <!-- Stylized C lines -->
      <path d="M 14,2 C 7,2 2,7 2,14 C 2,21 7,26 14,26 L 17,26 L 17,21 L 14,21 C 10,21 7,18 7,14 C 7,10 10,7 14,7 L 17,7 L 17,2 Z" fill="#0B2545"/>
      <path d="M 10,7 C 8,7 5,9 5,14 C 5,19 8,21 10,21 L 12,21 L 12,17 L 10,17 C 8,17 7,16 7,14 C 7,12 8,11 10,11 L 12,11 L 12,7 Z" fill="#0B2545"/>
      <!-- DAC text -->
      <text x="21" y="22" font-family="'Outfit', sans-serif" font-weight="800" font-size="22px" fill="#0B2545" letter-spacing="1px">DAC</text>
    </g>
  </g>

  <!-- Vertical Separator Line -->
  <line x1="94" y1="6" x2="94" y2="58" class="line-sep"/>

  <!-- Right Side Text -->
  <g transform="translate(104, 0)">
    <!-- Top Line Hindi: प्रगत संगणन विकास केंद्र -->
    <text x="0" y="25" class="hi-right">प्रगत संगणन विकास केंद्र</text>
    <!-- Bottom Line English: CENTRE FOR DEVELOPMENT OF ADVANCED COMPUTING -->
    <text x="0" y="49" class="en-right">CENTRE FOR DEVELOPMENT OF ADVANCED COMPUTING</text>
  </g>
</svg>
