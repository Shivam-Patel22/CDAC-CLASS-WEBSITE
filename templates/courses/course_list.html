{% extends 'base.html' %}
{% load static %}

{% block title %}Course Catalog & Training Programs | C-DAC{% endblock %}

{% block content %}
<div class="container">
    <!-- Section Header -->
    <div class="page-header" style="text-align: center; margin-bottom: 2rem;">
        <h1 class="page-title">Explore Our Course Catalog</h1>
        <p class="page-subtitle">Choose a domain category below to discover specialized diploma, degree, and certification tracks.</p>
    </div>

    <!-- Search & Filter Bar -->
    <div style="max-width: 650px; margin: 0 auto 2.5rem; position: relative;">
        <div style="position: relative; display: flex; align-items: center;">
            <input type="text" id="course-search-input" class="form-control" placeholder="🔍 Search categories or sub-courses (e.g. Tally, Python, Diploma, Figma)..." style="font-size: 1rem; padding: 0.9rem 1.25rem 0.9rem 3rem; border-radius: var(--radius-full); box-shadow: var(--shadow-sm); width: 100%;">
            <span style="position: absolute; left: 1.2rem; font-size: 1.2rem; pointer-events: none; opacity: 0.6;">🔍</span>
        </div>
    </div>

    <!-- Dynamic Courses Navigation Container -->
    <div class="courses-navigation-wrapper">
        <!-- LEVEL 1: Main Course Categories View -->
        <div id="categories-view" class="fade-in-view">
            <div class="courses-grid" id="categories-grid">
                <!-- Dynamically rendered via JavaScript -->
            </div>
        </div>

        <!-- LEVEL 2: Sub-Courses Listing View (Hidden initially) -->
        <div id="subcourses-view" class="fade-in-view" style="display: none;">
            <!-- Category Banner Header -->
            <div class="category-header-banner" id="category-banner">
                <!-- Dynamically rendered banner -->
            </div>

            <!-- Sub-Courses Grid -->
            <div class="courses-grid" id="subcourses-grid">
                <!-- Dynamically rendered sub-courses -->
            </div>
        </div>

        <!-- Search Results View (Fallback when searching globally) -->
        <div id="search-results-view" class="fade-in-view" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.3rem; font-weight: 700;">Search Results</h3>
                <button type="button" class="btn-back-courses" onclick="resetSearchAndShowCategories()">Clear Search</button>
            </div>
            <div class="courses-grid" id="search-results-grid"></div>
        </div>
    </div>
</div>

// Contact URL for Course Inquiry
const CONTACT_URL = "{% url 'core:contact' %}";

// DOM Elements
const categoriesView = document.getElementById('categories-view');
const categoriesGrid = document.getElementById('categories-grid');
const subcoursesView = document.getElementById('subcourses-view');
const categoryBanner = document.getElementById('category-banner');
const subcoursesGrid = document.getElementById('subcourses-grid');
const searchResultsView = document.getElementById('search-results-view');
const searchResultsGrid = document.getElementById('search-results-grid');
const searchInput = document.getElementById('course-search-input');

let currentActiveCategoryId = null;

// Render Level 1 Main Course Categories
function renderCategories() {
    categoriesGrid.innerHTML = '';
    COURSES_DATA.forEach(cat => {
        const subCount = cat.subCourses ? cat.subCourses.length : 0;
        const countLabel = subCount > 0 ? `${subCount} ${subCount === 1 ? 'Sub-Course' : 'Sub-Courses'}` : 'Direct Course';

        const card = document.createElement('div');
        card.className = 'course-category-card';
        card.onclick = () => openCategory(cat.id);

        card.innerHTML = `
            <div class="category-card-header">
                <div class="category-icon-box">${cat.icon}</div>
                <span class="category-count-badge">${countLabel}</span>
            </div>
            <div>
                <h2 class="category-title">${cat.name}</h2>
                <p class="category-desc">${cat.description}</p>
            </div>
            <div class="category-footer">
                <span class="btn-view-category">
                    Explore ${cat.name} <span>&rarr;</span>
                </span>
            </div>
        `;
        categoriesGrid.appendChild(card);
    });
}

// Open a specific Category View
function openCategory(catId) {
    const category = COURSES_DATA.find(c => c.id === catId);
    if (!category) return;

    currentActiveCategoryId = catId;
    window.location.hash = `cat-${catId}`;

    // Render Banner
    const subCount = category.subCourses ? category.subCourses.length : 0;
    categoryBanner.innerHTML = `
        <div class="category-banner-top">
            <button type="button" class="btn-back-courses" onclick="showCategoriesView()">
                <span>&larr;</span> Back to Course Categories
            </button>
            <span class="category-count-badge">${subCount} Total Sub-Courses</span>
        </div>
        <div class="category-banner-title-group">
            <div class="category-banner-icon">${category.icon}</div>
            <div>
                <h2 class="category-banner-title">${category.name}</h2>
                <p class="category-banner-meta">${category.description}</p>
            </div>
        </div>
    `;

    // Render Sub-Courses
    subcoursesGrid.innerHTML = '';
    if (category.subCourses && category.subCourses.length > 0) {
        category.subCourses.forEach(sub => {
            const subCard = document.createElement('div');
            subCard.className = 'subcourse-card';

            const defaultDesc = `Professional ${sub.name} course program tailored with practical lab training and certification.`;
            const desc = sub.description || defaultDesc;

            subCard.innerHTML = `
                <div>
                    <span class="subcourse-badge">${category.name}</span>
                    <h3 class="subcourse-title">${sub.name}</h3>
                    <p class="subcourse-desc">${desc}</p>
                </div>
                <div class="subcourse-footer">
                    <a href="${CONTACT_URL}" class="btn-subcourse-action">
                        Inquire / Enroll <span>&rarr;</span>
                    </a>
                </div>
            `;
            subcoursesGrid.appendChild(subCard);
        });
    } else {
        // Fallback for category with no sub-courses
        subcoursesGrid.innerHTML = `
            <div style="grid-column: 1 / -1; background: var(--card-bg); border: 1px solid var(--gray-200); padding: 3rem; text-align: center; border-radius: var(--radius-lg);">
                <h3 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.75rem;">${category.name}</h3>
                <p style="color: var(--gray-600); margin-bottom: 1.5rem; max-width: 600px; margin-left: auto; margin-right: auto;">${category.description}</p>
                <a href="${CONTACT_URL}" class="btn btn-primary">Enquire About ${category.name}</a>
            </div>
        `;
    }

    // Toggle Views
    categoriesView.style.display = 'none';
    searchResultsView.style.display = 'none';
    subcoursesView.style.display = 'block';

    // Scroll smoothly to top of grid
    document.querySelector('.courses-navigation-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Return to Main Course Categories View
function showCategoriesView() {
    currentActiveCategoryId = null;
    if (window.location.hash) {
        history.replaceState(null, document.title, window.location.pathname + window.location.search);
    }

    subcoursesView.style.display = 'none';
    searchResultsView.style.display = 'none';
    categoriesView.style.display = 'block';

    if (searchInput) searchInput.value = '';
}

// Search Filter Logic
function handleSearch(query) {
    const q = query.toLowerCase().trim();
    if (!q) {
        if (currentActiveCategoryId) {
            openCategory(currentActiveCategoryId);
        } else {
            showCategoriesView();
        }
        return;
    }

    // Perform Search across categories and sub-courses
    let results = [];
    COURSES_DATA.forEach(cat => {
        // Match category
        if (cat.name.toLowerCase().includes(q) || cat.description.toLowerCase().includes(q)) {
            results.push({
                type: 'category',
                categoryName: cat.name,
                title: cat.name,
                desc: cat.description,
                icon: cat.icon,
                catId: cat.id
            });
        }

        // Match sub-courses
        if (cat.subCourses) {
            cat.subCourses.forEach(sub => {
                if (sub.name.toLowerCase().includes(q) || (sub.description && sub.description.toLowerCase().includes(q))) {
                    results.push({
                        type: 'subcourse',
                        categoryName: cat.name,
                        title: sub.name,
                        desc: sub.description || `Specialized ${sub.name} training under ${cat.name}.`,
                        icon: cat.icon,
                        catId: cat.id
                    });
                }
            });
        }
    });

    // Render Search Results
    searchResultsGrid.innerHTML = '';
    if (results.length > 0) {
        results.forEach(res => {
            const card = document.createElement('div');
            card.className = res.type === 'category' ? 'course-category-card' : 'subcourse-card';

            if (res.type === 'category') {
                card.onclick = () => {
                    if (searchInput) searchInput.value = '';
                    openCategory(res.catId);
                };
                card.innerHTML = `
                    <div class="category-card-header">
                        <div class="category-icon-box">${res.icon}</div>
                        <span class="category-count-badge">Category</span>
                    </div>
                    <div>
                        <h3 class="category-title">${res.title}</h3>
                        <p class="category-desc">${res.desc}</p>
                    </div>
                    <div class="category-footer">
                        <span class="btn-view-category">View Category <span>&rarr;</span></span>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div>
                        <span class="subcourse-badge">${res.categoryName}</span>
                        <h3 class="subcourse-title">${res.title}</h3>
                        <p class="subcourse-desc">${res.desc}</p>
                    </div>
                    <div class="subcourse-footer">
                        <button type="button" class="btn-subcourse-action" style="background:none; border:none; padding:0; cursor:pointer;" onclick="openCategory('${res.catId}')">
                            View in ${res.categoryName} <span>&rarr;</span>
                        </button>
                    </div>
                `;
            }
            searchResultsGrid.appendChild(card);
        });
    } else {
        searchResultsGrid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--gray-200);">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem;">No matching courses found</h3>
                <p style="color: var(--gray-600); margin-bottom: 1.5rem;">Try searching for another term like "Tally", "Python", "Diploma", or "React".</p>
                <button type="button" class="btn btn-primary btn-sm" onclick="resetSearchAndShowCategories()">View All Categories</button>
            </div>
        `;
    }

    categoriesView.style.display = 'none';
    subcoursesView.style.display = 'none';
    searchResultsView.style.display = 'block';
}

function resetSearchAndShowCategories() {
    if (searchInput) searchInput.value = '';
    showCategoriesView();
}

// Initial Load & Route Handling
document.addEventListener('DOMContentLoaded', () => {
    renderCategories();

    // Check URL Hash (e.g. #cat-diploma-6-months)
    const hash = window.location.hash;
    if (hash && hash.startsWith('#cat-')) {
        const catId = hash.replace('#cat-', '');
        const exists = COURSES_DATA.some(c => c.id === catId);
        if (exists) {
            openCategory(catId);
        }
    }

    // Search input listener
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });
    }
});

// Window Hash Change Event Listener
window.addEventListener('hashchange', () => {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#cat-')) {
        const catId = hash.replace('#cat-', '');
        if (catId !== currentActiveCategoryId) {
            openCategory(catId);
        }
    } else if (!hash) {
        showCategoriesView();
    }
});
</script>
{% endblock %}
